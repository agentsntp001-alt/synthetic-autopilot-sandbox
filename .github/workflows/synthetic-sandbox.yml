name: Synthetic Sandbox Autopilot

permissions: {}

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

concurrency:
  group: synthetic-sandbox-autopilot
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline integration and security tests
        run: |
          python -m py_compile runner.py autopilot_queue.py
          python -m unittest discover -s tests -v

  preflight:
    # This user-triggered check NEVER calls Gemini and NEVER writes to GitHub.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect two public issues and pinned fixtures (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python autopilot_queue.py --dry-run --output sandbox-preflight.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sandbox-preflight-${{ github.run_id }}
          path: sandbox-preflight.json
          if-no-files-found: warn
          retention-days: 7

  propose:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SANDBOX_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: synthetic-only
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      # No third-party uses: actions run in the token-writable job.
      # Clone the already-public, protected main revision without credentials.
      - name: Checkout the exact protected public commit without Actions extensions
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git clone --no-checkout --depth=1 https://github.com/agentsntp001-alt/synthetic-autopilot-sandbox.git source
          cd source
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 --version | grep -E '^Python 3\.12\.'
      - name: Process at most two approved public tasks
        working-directory: source
        env:
          SANDBOX_ENABLED: ${{ vars.SANDBOX_ENABLED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 autopilot_queue.py --output sandbox-status.json
      - name: Show redacted execution summary
        if: always()
        run: |
          if [ -f source/sandbox-status.json ]; then
            cat source/sandbox-status.json
            cat source/sandbox-status.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No execution status produced' >> "$GITHUB_STEP_SUMMARY"
          fi
